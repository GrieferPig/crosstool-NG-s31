name: Build ESP32-S31 Linux toolchain

on:
  workflow_dispatch:
  push:
    branches:
      - esp-1.28.x
    paths:
      - .github/workflows/build-s31-linux-toolchain.yml
      - packages/**
      - scripts/**
      - config/**
      - Makefile.in
      - configure.ac

permissions:
  contents: read

concurrency:
  group: s31-linux-toolchain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Check out crosstool-NG
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out Espressif binutils wrappers
        uses: actions/checkout@v4
        with:
          repository: espressif/esp-toolchain-bin-wrappers
          ref: d8844fa7d904aefcb9484ff3a37f4f5c476321f6
          path: esp-toolchain-bin-wrappers

      - name: Check out ESP32-S31 Linux configuration
        uses: actions/checkout@v4
        with:
          repository: GrieferPig/esp32-s31-linux
          ref: main
          path: s31linux

      - name: Check out ESP32-S31 Linux kernel
        uses: actions/checkout@v4
        with:
          repository: GrieferPig/linux-esp32-s31
          ref: v6.12-esp32-s31
          path: s31linux/linux-esp32-s31

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake bison flex gawk gperf help2man libncurses-dev \
            libtool-bin meson ninja-build patch rsync texinfo unzip wget \
            xz-utils zstd

      - name: Build crosstool-NG
        run: |
          ./bootstrap
          ./configure --enable-local
          make -j"$(nproc)"

      - name: Prepare ESP32-S31 configuration
        run: |
          sed \
            -e "s|^CT_PREFIX_DIR=.*|CT_PREFIX_DIR=\"${GITHUB_WORKSPACE}/x-tools/riscv32-esp-linux-musl\"|" \
            -e "s|^CT_LOCAL_PATCH_DIR=.*|CT_LOCAL_PATCH_DIR=\"${GITHUB_WORKSPACE}/s31linux/toolchain-patches\"|" \
            -e "s|^CT_LINUX_CUSTOM_LOCATION=.*|CT_LINUX_CUSTOM_LOCATION=\"${GITHUB_WORKSPACE}/s31linux/linux-esp32-s31\"|" \
            -e "s|^CT_BINUTILS_ESP32P4_BIN_WRAPPERS_LOCATION=.*|CT_BINUTILS_ESP32P4_BIN_WRAPPERS_LOCATION=\"${GITHUB_WORKSPACE}/esp-toolchain-bin-wrappers/gnu-riscv-binutils\"|" \
            s31linux/configs/riscv32-esp-linux-musl.config > s31-linux.config
          ./ct-ng defconfig DEFCONFIG="${GITHUB_WORKSPACE}/s31-linux.config"
          sed -i \
            -e 's/^CT_LOG_PROGRESS_BAR=y/# CT_LOG_PROGRESS_BAR is not set/' \
            -e "s|^CT_LOCAL_TARBALLS_DIR=.*|CT_LOCAL_TARBALLS_DIR=\"${GITHUB_WORKSPACE}/src\"|" \
            .config

      - name: Seed musl release tarball
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/src"
          wget --tries=5 --timeout=30 \
            https://sources.buildroot.net/musl/musl-1.2.5.tar.gz \
            -O "${GITHUB_WORKSPACE}/src/musl-1.2.5.tar.gz"

      - name: Verify bundled S31 patch set
        shell: bash
        run: |
          set -euo pipefail
          test -f packages/gcc/git-0dbf5849/0001-xesploop.patch
          test -f packages/gcc/git-0dbf5849/0002-riscv-xesploop-reject-early-exit-loops.patch
          test -f packages/musl/1.2.5/0002-riscv32-add-xespv-string-operations.patch
          test ! -e packages/musl/1.2.5/0002-riscv32-add-esp32s31-xespv-memory-routines.patch
          grep -q '^CT_PATCH_BUNDLED=y$' .config
          grep -q '^CT_PATCH_ORDER="bundled"$' .config
          grep -q '^CT_MUSL_VERSION="1.2.5"$' .config
          sha256sum \
            packages/gcc/git-0dbf5849/0001-xesploop.patch \
            packages/gcc/git-0dbf5849/0002-riscv-xesploop-reject-early-exit-loops.patch \
            packages/musl/1.2.5/0002-riscv32-add-xespv-string-operations.patch \
            | tee s31-patch-sha256.txt

      - name: Build ESP32-S31 Linux toolchain
        run: ./ct-ng build."$(nproc)"

      - name: Verify generated toolchain
        shell: bash
        run: |
          set -euo pipefail
          prefix="${GITHUB_WORKSPACE}/x-tools/riscv32-esp-linux-musl"
          target="riscv32-esp-linux-musl"
          gcc="${prefix}/bin/${target}-gcc"
          readelf="${prefix}/bin/${target}-readelf"
          objdump="${prefix}/bin/${target}-objdump"
          libc="${prefix}/${target}/sysroot/usr/lib/libc.so"

          "${gcc}" --version | tee toolchain-version.txt
          ! grep -q 'crosstool-NG UNKNOWN' toolchain-version.txt
          "${readelf}" -A "${libc}" | tee libc-attributes.txt
          rg_arch=$(sed -n 's/.*Tag_RISCV_arch: "\([^"]*\)".*/\1/p' libc-attributes.txt)
          for extension in _f _zaamo _zalrsc _zba _zbb _zbc _zbs _xesploop _xespv2p2; do
            [[ "${rg_arch}" == *"${extension}"* ]]
          done

          "${objdump}" -d "${libc}" > libc-disassembly.txt
          for symbol in memcpy memchr memrchr memcmp strcmp; do
            grep -q "<${symbol}>:" libc-disassembly.txt
          done
          grep -q '<__riscv32_xespv_memcpy64>:' libc-disassembly.txt
          sed -n '/<memcpy>:/,/^$/p' libc-disassembly.txt > memcpy-disassembly.txt
          sed -n '/<__riscv32_xespv_memcpy64>:/,/^$/p' libc-disassembly.txt \
            > memcpy-kernel-disassembly.txt
          sed -n '/<memset>:/,/^$/p' libc-disassembly.txt > memset-disassembly.txt
          grep -q '__riscv32_xespv_memcpy64' memcpy-disassembly.txt
          for symbol in memchr memrchr memcmp strcmp; do
            sed -n "/<${symbol}>:/,/^$/p" libc-disassembly.txt \
              > "${symbol}-disassembly.txt"
            grep -q 'esp.vld.128.ip' "${symbol}-disassembly.txt"
            grep -q 'esp.vcmp.eq.u8' "${symbol}-disassembly.txt"
          done
          grep -q 'esp.vld.128.ip' memcpy-kernel-disassembly.txt
          grep -q 'esp.vst.128.ip' memcpy-kernel-disassembly.txt
          ! grep -q 'esp\.' memset-disassembly.txt

          cat > f-only-test.c <<'EOF'
          __attribute__((noinline)) float addf(float a, float b) { return a + b; }
          __attribute__((noinline)) double addd(double a, double b) { return a + b; }
          EOF
          "${gcc}" -O2 -S f-only-test.c -o f-only-test.s
          grep -q 'fadd.s' f-only-test.s
          grep -q '__adddf3' f-only-test.s
          ! grep -Eq 'f(add|sub|mul|div)\\.d' f-only-test.s

          "${gcc}" -O2 -c s31linux/rootfs/s31_ext_test.S -o s31-ext-test.o

          cat > xesploop-control-flow-test.c <<'EOF'
          __attribute__((noinline)) int early_exit(const unsigned char *p)
          {
            for (int i = 0; i < 32; i++)
              if (p[i] == 0)
                return i;
            return -1;
          }

          __attribute__((noinline)) unsigned single_exit(const unsigned char *p)
          {
            unsigned sum = 0;
            for (int i = 0; i < 32; i++)
              sum += p[i];
            return sum;
          }

          __attribute__((noinline)) void *branch_end(void **items, int count,
                                                     void **out)
          {
            void *last = 0;
            for (int i = 0; i < count; i++) {
              void *item = *items++;
              if (item)
                last = item;
            }
            if (out)
              *out = 0;
            return last;
          }
          EOF
          "${gcc}" -O2 -S xesploop-control-flow-test.c -o xesploop-control-flow-test.s
          sed -n '/early_exit:/,/\.size[[:space:]]*early_exit/p' \
            xesploop-control-flow-test.s > xesploop-early-exit.s
          sed -n '/single_exit:/,/\.size[[:space:]]*single_exit/p' \
            xesploop-control-flow-test.s > xesploop-single-exit.s
          sed -n '/branch_end:/,/\.size[[:space:]]*branch_end/p' \
            xesploop-control-flow-test.s > xesploop-branch-end.s
          ! grep -q 'esp\.lp\.setup' xesploop-early-exit.s
          grep -q 'esp\.lp\.setup' xesploop-single-exit.s
          grep -q 'esp\.lp\.setup' xesploop-branch-end.s

          # The XEspressif TRM forbids a branch or jump at the HWLP end.
          end_label="$({ sed -n \
            's/.*esp\.lp\.setup[^,]*,[^,]*,[[:space:]]*\([^[:space:]]*\).*/\1/p' \
            xesploop-single-exit.s; } | head -n1)"
          test -n "${end_label}"
          end_opcode="$(awk -v label="${end_label}:" '
            $1 == label { at_end = 1; next }
            at_end && $1 !~ /^\./ { print $1; exit }
          ' xesploop-single-exit.s)"
          test -n "${end_opcode}"
          case "${end_opcode}" in
            b*|j*|ret|call|tail)
              echo "unsafe Xesploop end opcode: ${end_opcode}" >&2
              exit 1
              ;;
          esac

          # A label-only latch used to alias the end address with the branch
          # in the successor block. It must now materialize a real nop.
          end_label="$({ sed -n \
            's/.*esp\.lp\.setup[^,]*,[^,]*,[[:space:]]*\([^[:space:]]*\).*/\1/p' \
            xesploop-branch-end.s; } | head -n1)"
          test -n "${end_label}"
          end_opcode="$(awk -v label="${end_label}:" '
            $1 == label { at_end = 1; next }
            at_end && $1 !~ /^\./ { print $1; exit }
          ' xesploop-branch-end.s)"
          test "${end_opcode}" = nop

      - name: Package toolchain
        run: |
          prefix="${GITHUB_WORKSPACE}/x-tools/riscv32-esp-linux-musl"
          mkdir -p package-metadata
          cp .config package-metadata/crosstool-ng.config
          cp toolchain-version.txt libc-attributes.txt f-only-test.s \
            s31-patch-sha256.txt package-metadata/
          mkdir -p artifact
          tar -cJf artifact/riscv32-esp-linux-musl.tar.xz \
            -C "${prefix}" . \
            -C "${GITHUB_WORKSPACE}/package-metadata" .
          cd artifact
          sha256sum riscv32-esp-linux-musl.tar.xz \
            > riscv32-esp-linux-musl.tar.xz.sha256
          sha256sum --check riscv32-esp-linux-musl.tar.xz.sha256

      - name: Upload ESP32-S31 Linux toolchain
        uses: actions/upload-artifact@v4
        with:
          name: riscv32-esp-linux-musl-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riscv32-esp-linux-musl-build-log-${{ github.sha }}
          path: |
            build.log
            .config
            s31-linux.config
            toolchain-version.txt
            libc-attributes.txt
            libc-disassembly.txt
            memcpy-disassembly.txt
            memcpy-kernel-disassembly.txt
            memset-disassembly.txt
            memchr-disassembly.txt
            memrchr-disassembly.txt
            memcmp-disassembly.txt
            strcmp-disassembly.txt
            s31-patch-sha256.txt
            f-only-test.s
            xesploop-control-flow-test.s
            xesploop-early-exit.s
            xesploop-single-exit.s
            xesploop-branch-end.s
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
